name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile || yarn install

      - name: Type check
        run: yarn typecheck

      - name: Background tests (coverage)
        run: yarn test:bg:coverage

      - name: UI tests (coverage)
        run: yarn test:ui:coverage

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            coverage
            coverage/lcov.info
            coverage/ChromeHeadless*/lcov.info
            .nyc_output

      - name: Upload coverage to Codecov (optional)
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: "coverage/lcov.info"  # UI
          verbose: true
        continue-on-error: true

      - name: Archive background spec output (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: background-spec-artifacts
          path: out-tsc/background-spec

      - name: Archive dist build (optional)
        if: success()
        run: |
          yarn build
        continue-on-error: true
      - name: Upload dist artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: extension-dist
          path: dist
