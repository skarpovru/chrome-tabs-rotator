name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Angular 20 requires Node ^20.19.0 || ^22.12.0 || >=24.0.0.
        # We test the minimum supported in each active major plus latest current (24) for forward safety.
        node: [20.19.0, 22.12.0, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Type check
        run: yarn typecheck

      - name: ESLint (TS)
        run: yarn lint:ts

      - name: CSS Lint
        run: yarn lint:css || echo "Ignoring stylelint non-zero exit (warnings)"

      - name: Background tests (coverage)
        run: yarn test:bg:coverage

      - name: UI tests (coverage)
        run: yarn test:ui:coverage


      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports-node-${{ matrix.node }}
          path: |
            coverage
            coverage/lcov.info
            .nyc_output
          if-no-files-found: warn

      - name: Archive background spec output (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: background-spec-node-${{ matrix.node }}
          path: out-tsc/background-spec
          if-no-files-found: ignore

      - name: Build extension (single build on primary LTS Node 22)
        if: startsWith(matrix.node, '22.')
        run: yarn build

      - name: Upload dist artifact
        if: startsWith(matrix.node, '22.')
        uses: actions/upload-artifact@v4
        with:
          name: extension-dist
          path: dist
