name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22.12.0
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Quality Gates (type, lint TS & CSS)
        run: yarn quality

      - name: Background tests (coverage)
        run: yarn test:bg:coverage

      - name: UI tests (coverage)
        run: yarn test:ui:coverage


      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports-node-22
          path: |
            coverage
            coverage/lcov.info
            .nyc_output
          if-no-files-found: warn

      - name: Archive background spec output (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: background-spec-node-22
          path: out-tsc/background-spec
          if-no-files-found: ignore

      - name: Build extension
        run: yarn build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: extension-dist-node-22
          path: dist
